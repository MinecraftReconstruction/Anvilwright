name: build

# NOTE(porting): upstream's workflow was `on: [push, pull_request]` and ran `./gradlew buildOrPublish`, which built
# and published the Forge mod. This port cannot build that way: Tinkers' Construct needs Mantle from the
# MinecraftReconstruction/Mantle-Fabric fork at the exact commit pinned in gradle.properties, and that artifact is not
# on any public maven. As a result every push to a branch produced a failing run. The workflow now runs on demand and
# on pull requests, builds Mantle from source first, and only then builds Tinkers.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: read the pinned Mantle commit
        id: mantle
        run: |
          version=$(grep -E '^mantle_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${version##*.}" >> "$GITHUB_OUTPUT"

      - name: checkout Mantle
        uses: actions/checkout@v4
        with:
          repository: MinecraftReconstruction/Mantle-Fabric
          ref: mcr/mantle-1.11
          path: mantle
          fetch-depth: 0

      - name: check out the pinned Mantle commit
        working-directory: mantle
        run: git checkout ${{ steps.mantle.outputs.commit }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew ./mantle/gradlew

      - name: publish Mantle to mavenLocal
        working-directory: mantle
        env:
          # publish under exactly the version Tinkers pins, instead of relying on Mantle's own git short hash (the
          # abbreviation length can differ between checkouts, which made the dependency unresolvable)
          ARTIFACT_VERSION: ${{ steps.mantle.outputs.version }}
        run: ./gradlew publishToMavenLocal -x test --no-daemon

      - name: show what Mantle published
        run: ls -d ~/.m2/repository/slimeknights/mantle/Mantle/*/ || true

      - name: build
        run: ./gradlew build -x test --no-daemon

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
